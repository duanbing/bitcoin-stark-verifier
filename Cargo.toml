[package]
name = "bitcoin-poseidon2-script"
version = "0.1.0"
edition = "2021"
description = "Poseidon2 over KoalaBear in Bitcoin Script, without OP_CAT"
license = "MIT"

[dependencies]
bitcoin-script = { git = "https://github.com/Bitcoin-Wildlife-Sanctuary/rust-bitcoin-script", tag = "1.0.0" }
bitcoin = "0.32.0"

[dev-dependencies]
bitcoin-scriptexec = { git = "https://github.com/Bitcoin-Wildlife-Sanctuary/rust-bitcoin-scriptexec/", features = ["debug"], tag = "1.0.0" }
rand = "0.9.1"
rand_chacha = "0.9.0"
p3-field = { git = "https://github.com/Plonky3/Plonky3" }
p3-koala-bear = { git = "https://github.com/Plonky3/Plonky3" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3" }

[profile.dev]
opt-level = 3
[profile.test]
opt-level = 3
